# Stage 3 with MolScribe (PyTorch). Also runs the Markush branch (RDKit) and the tests.
name: xn-stage3-molscribe
channels:
  - conda-forge
dependencies:
  - python=3.10
  - rdkit
  - pip
  - pip:
      - torch
      - huggingface_hub
      - Pillow
      - PyYAML
      - pytest
      - reportlab
      - git+https://github.com/thomas0809/MolScribe.git
